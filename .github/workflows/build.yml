name: build

# Every push runs the tests and builds both images for amd64 and arm64.
# Images are pushed for version tags only: vX.Y.Z gets X.Y.Z, X.Y, and latest;
# vX.Y.Z-rc.N gets only its own tag.
on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # Docker 24 and 29 in Docker-in-Docker, from deploy/compose/compose.e2e.yaml.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      - if: always()
        run: make e2e-down

  # Go cross-compiles in the build stage and the final stages only copy files,
  # so arm64 needs no QEMU.
  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: server
            image: hikifune
          - target: agent
            image: hikifune-agent
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE }}
            type=raw,value=latest,enable=${{ env.STABLE }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.RELEASE == 'true' && github.ref_name || github.sha }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
